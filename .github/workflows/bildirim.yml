name: YKS Asistanim Bildirim ve Seri Botu

on:
  schedule:
    # Gunduz ve sabah saatlerinde her 15 dakikada bir calisir
    - cron: "*/15 5-16 * * *"
    # Aksam kritik seri saatlerinde (20:00 - 23:59 TSİ / 17:00 - 20:59 UTC) her 5 dakikada bir calisir
    - cron: "*/5 17-20 * * *"
  workflow_dispatch:

jobs:
  bildirim-gonder:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu kopyala
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari yukle
        run: pip install requests

      - name: Bildirim botunu calistir
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          NTFY_SUNUCU: ${{ secrets.NTFY_SUNUCU }}
        run: python bildirim_botu.py
